<div class="card-menu">
  <button
    type="button"
    class="card-menu__trigger"
    [class.card-menu__trigger--open]="open()"
    (click)="toggle($event)"
    [attr.aria-expanded]="open()"
    aria-label="More options"
  >
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="10" cy="4.5" r="1.4" fill="currentColor"/>
      <circle cx="10" cy="10" r="1.4" fill="currentColor"/>
      <circle cx="10" cy="15.5" r="1.4" fill="currentColor"/>
    </svg>
  </button>

  @if (open()) {
    <div class="card-menu__dropdown" role="menu">
      @if (!confirmingDelete()) {
        <button type="button" class="card-menu__item" (click)="onAddLink()">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Add link / setup doc
        </button>
        <button type="button" class="card-menu__item card-menu__item--danger" (click)="askDelete()">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 6h10M8.5 6V4.5h3V6M6 6l.6 9.2A1 1 0 0 0 7.6 16h4.8a1 1 0 0 0 1-.8L14 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Delete repo
        </button>
      } @else {
        <p class="card-menu__confirm-text">Delete {{ repo().name }}? This can't be undone here.</p>
        <div class="card-menu__confirm-row">
          <button type="button" class="card-menu__item" (click)="cancelDelete()">Cancel</button>
          <button type="button" class="card-menu__item card-menu__item--danger-fill" (click)="confirmDelete()">Delete</button>
        </div>
      }
    </div>
  }
</div>
