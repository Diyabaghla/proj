<div class="backdrop" (click)="onBackdropClick()">
  <div class="modal" role="dialog" aria-modal="true" [attr.aria-label]="'Add a link to ' + repo().name" (click)="$event.stopPropagation()">
    <header class="modal__header">
      <div class="modal__title-group">
        <span class="modal__icon">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M8.5 11.5 11.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10 6.5 11 5.5a2.5 2.5 0 0 1 3.5 3.5l-1 1M10 13.5 9 14.5a2.5 2.5 0 0 1-3.5-3.5l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <div>
          <p class="modal__eyebrow">{{ repo().name }}</p>
          <h2 class="modal__title">Add a link</h2>
        </div>
      </div>
      <button type="button" class="modal__close" (click)="close()" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <form class="modal__body" (submit)="$event.preventDefault(); submit()">
      <label class="field">
        <span class="field__label">Name</span>
        <input
          class="field__input"
          type="text"
          placeholder="e.g. Local setup doc, Postman collection"
          [value]="label()"
          (input)="label.set($any($event.target).value)"
          autofocus
        />
      </label>

      <label class="field">
        <span class="field__label">URL</span>
        <input
          class="field__input field__input--mono"
          type="text"
          placeholder="https://…"
          [value]="url()"
          (input)="url.set($any($event.target).value)"
        />
      </label>

      @if (error()) {
        <p class="field__error">{{ error() }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="modal__btn" (click)="close()">Cancel</button>
        <button type="submit" class="modal__btn modal__btn--primary">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Add link
        </button>
      </div>
    </form>
  </div>
</div>
