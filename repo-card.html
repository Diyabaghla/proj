<article class="card" [style.--stagger]="index()">
  <header class="card__header">
    <div class="card__badge">{{ initials() }}</div>
    <div class="card__heading">
      <h3 class="card__name">{{ repo().name }}</h3>
      <span class="card__team">{{ repo().team }}</span>
    </div>
  </header>

  <p class="card__description">{{ repo().description }}</p>

  <div class="card__actions">
    <app-link-action
      label="QA link"
      [url]="repo().qaLink"
      variant="teal"
      (copied)="copied.emit($event)"
    />
    <app-link-action
      label="Repo link"
      [url]="repo().repoLink"
      (copied)="copied.emit($event)"
    />
    <button type="button" class="card__settings-btn" (click)="onOpenAppSettings()">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4.5 5.5h11M4.5 10h11M4.5 14.5h6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      appsettings.json
    </button>
  </div>
</article>
