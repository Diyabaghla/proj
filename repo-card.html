<article
  class="card"
  [id]="'repo-' + repo().id"
  [class.card--highlight]="isHighlighted()"
  [style.--stagger]="index()"
>
  <div class="card__toolbar">
    <button
      type="button"
      class="card__pin"
      [class.card__pin--active]="pinned()"
      (click)="togglePin.emit(repo().id)"
      [attr.aria-pressed]="pinned()"
      [attr.aria-label]="pinned() ? 'Unpin ' + repo().name : 'Pin ' + repo().name"
    >
      <svg viewBox="0 0 20 20" [attr.fill]="pinned() ? 'currentColor' : 'none'" aria-hidden="true">
        <path d="M10 2.5 12 7.8l5.5.6-4.2 3.7 1.3 5.4L10 14.8l-4.6 2.7 1.3-5.4-4.2-3.7 5.5-.6L10 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
    <app-card-menu
      [repo]="repo()"
      (addLink)="addLink.emit($event)"
      (deleteRepo)="deleteRepo.emit($event)"
    />
  </div>

  <header class="card__header">
    <div class="card__badge">{{ initials() }}</div>
    <div class="card__heading">
      <h3 class="card__name">{{ repo().name }}</h3>
      <span class="card__team">{{ repo().team }}</span>
    </div>
  </header>

  <p class="card__description">{{ repo().description }}</p>

  <div class="card__actions">
    <app-link-action
      label="QA link"
      [url]="repo().qaLink"
      variant="teal"
      (copied)="copied.emit($event)"
    />
    <app-link-action
      label="Repo link"
      [url]="repo().repoLink"
      (copied)="copied.emit($event)"
    />
    <app-link-action
      label="App link"
      [url]="repo().appLink"
      variant="amber"
      (copied)="copied.emit($event)"
    />
    @for (link of repo().extraLinks; track link.id) {
      <app-link-action
        [label]="link.label"
        [url]="link.url"
        (copied)="copied.emit($event)"
      />
    }
  </div>

  <div class="card__files">
    <span class="card__files-label">Config</span>
    <div class="card__files-row">
      <button type="button" class="card__settings-btn" (click)="onOpenAppSettings('production')">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4.5 5.5h11M4.5 10h11M4.5 14.5h6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        appsettings.json
      </button>
      <button type="button" class="card__settings-btn card__settings-btn--dev" (click)="onOpenAppSettings('local')">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4.5 5.5h11M4.5 10h11M4.5 14.5h6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        appsettings.local.json
      </button>
    </div>
  </div>

  @if (dependencyChips().length) {
    <div class="card__deps">
      <span class="card__files-label">Depends on</span>
      <div class="card__deps-row">
        @for (dep of dependencyChips(); track dep.id) {
          <button type="button" class="card__dep-chip" (click)="jumpToDependency.emit(dep.id)">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 10h10M10.5 6.5 14 10l-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{ dep.name }}
          </button>
        }
      </div>
    </div>
  }
</article>
