<div class="link-action">
  <button
    type="button"
    class="link-action__trigger"
    [class.link-action__trigger--teal]="variant() === 'teal'"
    [class.link-action__trigger--amber]="variant() === 'amber'"
    [class.link-action__trigger--open]="open()"
    (click)="toggle($event)"
    [attr.aria-expanded]="open()"
  >
    <svg class="link-action__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M8.5 11.5 11.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M10 6.5 11 5.5a2.5 2.5 0 0 1 3.5 3.5l-1 1M10 13.5 9 14.5a2.5 2.5 0 0 1-3.5-3.5l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    {{ label() }}
  </button>

  @if (open()) {
    <div class="link-action__popover" role="menu">
      <p class="link-action__url">{{ url() }}</p>
      <div class="link-action__row">
        <button type="button" class="link-action__pop-btn" (click)="copyLink()">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="7" y="7" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M4.5 12.5v-7A1.5 1.5 0 0 1 6 4h7" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          Copy
        </button>
        <button type="button" class="link-action__pop-btn link-action__pop-btn--fill" (click)="openInBrowser()">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M8.5 5.5h-3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M11.5 4.5h4v4M15.3 4.7l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Open in browser
        </button>
      </div>
    </div>
  }
</div>
